[project]
name = "fugojev"
version = "1.3.0"
description = "Closed-set extraction of endometrial-cancer FIGO stage and its components from clinical notes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-calamine>=0.2",
    "torch>=2.6",
    "transformers>=4.46,<6",
    "peft>=0.13",
]

[project.optional-dependencies]
# Qwen3.5 (Gated DeltaNet) backbone: transformers 5 model code plus the Triton kernels.
qwen35 = [
    "transformers>=5.17,<6",
    "peft>=0.21",
    "flash-linear-attention>=0.5",
    "accelerate>=1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

